[workspace]
resolver = "2"
members = [
    "crates/moeflux",
    "crates/moeflux-metal",
]

[workspace.package]
version       = "0.1.0-pre.2"
edition       = "2024"
rust-version  = "1.89"
license       = "MIT"
repository    = "https://github.com/mdegans/moeflux"
authors       = [
    "Michael de Gans <michael.john.degans@gmail.com>",
    "Claude Opus 4.6 (Anthropic) <noreply@anthropic.com>",
    "Claude Opus 4.7 (Anthropic) <noreply@anthropic.com>",
]

[workspace.dependencies]
thiserror   = "1.0"
memmap2     = "0.9"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
# Metal bindings for the RIIR port. Mature, used by candle / mistral.rs.
# objc-related transitive deps come from metal-rs's `link` feature.
metal       = "0.32"
# Work-stealing thread pool for parallel K-expert pread (slice 5d-6).
rayon       = "1.10"
# Used for `fcntl(F_RDAHEAD, 0)` on layer fds — disables kernel
# readahead for the random per-token expert access pattern.
libc        = "0.2"
# POD reinterpret casts (&[f32] <-> &[u8]) for state snapshot I/O.
bytemuck    = "1"
# Compile-time POD layout assertions next to `unsafe` casts and
# transmutes. Already used the same way in drama_llama; pulled in here
# to back the same discipline for the Metal-buffer view boundary and
# the `align_to`-based bf16/f32 readers.
static_assertions = "1.1"
# Direct Objective-C messaging for surfacing `cmdbuf.error()` detail —
# metal-rs defines `MTLCommandBufferError` but exposes no accessor for
# the NSError on a failed command buffer. Already a transitive dep of
# `metal`; declaring direct so we can use `msg_send!`.
objc        = "0.2"
# Total physical RAM detection for the decode-IO mode gate. We only
# call `System::new().total_memory()` once at `RsCtx::open` — minimal
# surface, but `sysinfo` is the well-known crate for this so we don't
# hand-roll a `libc::sysctl` for one fact.
sysinfo     = { version = "0.32", default-features = false, features = ["system"] }

[profile.release]
opt-level = 3
lto       = "thin"
