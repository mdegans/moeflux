[package]
name          = "moeflux"
description   = "Pure-Rust streaming-experts MoE inference on Metal. Forked from flash-moe; only the Metal kernels remain from upstream."
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
authors       = { workspace = true }
readme        = "../../README.md"

[features]
default = []

# Model variant features. Select exactly one. These gate the
# per-variant shape constants in `riir/variants.rs` and the
# integration test binaries.
model-qwen3-5-a17b      = []
model-qwen3-6-35b-a3b   = []
# Cogito-V2-Preview-671B (DeepSeek-V3 architecture).
model-cogito-v2-671b    = []

[dependencies]
thiserror   = { workspace = true }
memmap2     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
metal       = { workspace = true }
rayon       = { workspace = true }
libc        = { workspace = true }
bytemuck    = { workspace = true }
objc        = { workspace = true }
static_assertions = { workspace = true }
sysinfo     = { workspace = true }
# Vendored, MLX-derived Metal kernels — the tiled quantized GEMM that
# replaces the memory-bound 4-bit dequant matvec.
moeflux-metal = { version = "=0.1.0-pre.4", path = "../moeflux-metal" }

[dev-dependencies]
